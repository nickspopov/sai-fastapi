version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sai
      - SQL_ECHO=${SQL_ECHO:-true}
      - SKIP_AUTH=${SKIP_AUTH:-true}
      - DEFAULT_DEV_USER_EMAIL=${DEFAULT_DEV_USER_EMAIL:-}
      - CHECK_DB_CONNECTION=true
      - RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 